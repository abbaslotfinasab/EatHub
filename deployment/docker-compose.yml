services:

  backend:
    image: eathub-backend-${DEPLOYMENT_NAMESPACE:?required}:${STATIC_ASSET_ATTEMPT:?required}
    container_name: eathub_backend
    command: gunicorn EatHub.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ../backend/.env
    environment:
      EATHUB_RELEASE_ID: success-${STATIC_ASSET_ATTEMPT:?required}
    depends_on:
      - db
      - redis
    volumes:
      - ../backend/media:/app/media
    networks:
      - eathub

  frontend:
    image: eathub-frontend-${DEPLOYMENT_NAMESPACE:?required}:${STATIC_ASSET_ATTEMPT:?required}
    container_name: eathub_frontend
    expose:
      - "80"
    networks:
      - eathub

  db:
    image: postgres:16
    container_name: eathub_db
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eathub

  redis:
    image: redis:7
    container_name: eathub_redis
    networks:
      - eathub

  celery:
    image: eathub-backend-${DEPLOYMENT_NAMESPACE:?required}:${STATIC_ASSET_ATTEMPT:?required}
    command: celery -A EatHub.celery:app worker -l info
    env_file:
      - ../backend/.env
    environment:
      EATHUB_RELEASE_ID: success-${STATIC_ASSET_ATTEMPT:?required}
    depends_on:
      - backend
      - redis
      - db
    networks:
      - eathub

  nginx:
    image: nginx:alpine
    container_name: eathub_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../backend/media:/app/media
      - static_assets:/app/staticfiles:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - eathub

volumes:
  postgres_data:
  static_assets:
    name: eathub-${DEPLOYMENT_NAMESPACE:?required}-static-${STATIC_ASSET_ATTEMPT:?required}


networks:
  eathub:
    driver: bridge
