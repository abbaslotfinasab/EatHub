name: Release Branch Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  require-develop-source:
    name: Require develop as PR source
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "::error::Pull requests targeting main must come from develop. Got: $SOURCE_BRANCH"
            exit 1
          fi
          echo "Source branch is develop."
