name: Backend CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-postgres:
    name: Django / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eathub_ci
          POSTGRES_USER: eathub_ci
          POSTGRES_PASSWORD: eathub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eathub_ci -d eathub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
      USE_SQLITE: "False"
      DB_NAME: eathub_ci
      DB_USER: eathub_ci
      DB_PASSWORD: eathub_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django configuration
        run: python manage.py check

      - name: Verify migration files
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to disposable CI database
        run: python manage.py migrate --noinput

      - name: Audit tenant integrity on clean database
        run: python manage.py audit_tenant_integrity --fail-on-issues

      - name: Run Django test suite
        run: python manage.py test --verbosity 2
