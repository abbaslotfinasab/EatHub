name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
      - feature/purchase-frontend-foundation

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / TypeScript and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            console.log("AUDIT_META", JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log("AUDIT_ITEM", JSON.stringify({
                name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                nodes: item.nodes,
                via: item.via,
                effects: item.effects,
                fixAvailable: item.fixAvailable
              }));
            }
          '

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: node --experimental-transform-types --test src/core/presentation/components/order/*.test.mjs src/core/data/mappers/*.test.mjs
