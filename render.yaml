services:
  - type: web
    name: eathub-staging-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: off
    dockerCommand: sh -c 'python manage.py collectstatic --noinput && python manage.py migrate --noinput && exec gunicorn EatHub.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: EatHub.settings_staging
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
